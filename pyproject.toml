[project]
name = "revora"
version = "0.1.0"
description = "Revora — an AI-assisted incremental revenue recovery decision system"
readme = "README.md"
requires-python = ">=3.12"

# Lower bounds are declared here; exact reproducibility comes from requirements.lock
# (generated by `pip freeze`) rather than from hand-pinned version strings.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "cryptography>=43.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
# Estimation layer only (task 15). Kept separate so the foundation phase does not
# block on a scientific-stack wheel for a very new interpreter.
ml = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "testcontainers[postgres]>=4.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revora*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "A005",  # revora.platform intentionally mirrors the design's module map
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# mypy — strict only where a type error becomes a money bug
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["revora.domain.*", "revora.policy.*", "revora.optimizer.*"]
strict = true
disallow_any_explicit = true
warn_return_any = true

# ---------------------------------------------------------------------------
# pytest — four cost tiers, per the design's Testing Strategy
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pure: no I/O at all, microsecond tier, runs on every commit",
    "model: in-memory fake repositories, seconds, runs on every commit",
    "pg: needs a real PostgreSQL via testcontainers, runs on every push",
    "harness: full synthetic pipeline, runs nightly and pre-demo",
    "spike: manual provider verification against test-mode credentials",
    # Timing assertions with order-of-magnitude margins. Excluded from the gating selection with
    # `-m "not smoke"` because on shared runners a latency bound measures the hardware as much as
    # the code, and a gate that fails for reasons nobody can act on teaches everyone to re-run the
    # build. Tagged rather than deleted so the budgets stay written down somewhere a person checks.
    "smoke: latency and startup-cost assertions, excluded from gating",
]
addopts = "--strict-markers -q"
