; Alembic configuration.
;
; There is no sqlalchemy.url here on purpose. The connection string is the one
; piece of database configuration that lives in the environment (REVORA_DATABASE_URL),
; and a URL committed to this file is a URL somebody eventually runs a migration
; against by accident. env.py reads the variable.
;
; Revision filenames are prefixed with a zero-padded ordinal rather than a hash so
; that `ls versions/` reads in apply order.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
