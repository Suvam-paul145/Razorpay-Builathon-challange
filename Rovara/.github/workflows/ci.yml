# CI mirrors the design's Cost Tiers and the "What CI Enforces Beyond Tests" list.
#
# The gates that are structural claims, not behaviour, run first and cheapest:
# import contracts (the mechanism behind policy AI-isolation), the no-float check,
# strict typing on the money-bearing modules, and lint. Then the pure and model
# test tiers on every push. The Postgres tier runs against a service container
# because the concurrency and constraint claims cannot be tested any other way.
#
# The null-scenario evidence gate is its own job and it runs on every push, not only
# nightly. Task 27.4 asks for the nightly tier plus "a required gate before any demo
# build"; a job that has to pass on the commit a demo is built from is the strongest
# available reading of that, and it costs about a minute. The full harness tier —
# every scenario plus the interval-coverage check — is the nightly job, because the
# coverage check alone is a minute of Postgres round-trips.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly, after most working days in IST. The harness tier is slow, not urgent.
    - cron: "0 19 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: Rovara

# Every Postgres service below pins postgres:18 to match docker-compose and the managed
# Neon instance. Repeated rather than shared through `env`, because `services.*.image`
# does not expand the `env` context — a variable there would silently resolve to an
# empty image name. Three copies that are checked by a grep in review beats one copy
# that does not work.

jobs:
  static:
    name: static checks (lint, types, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Ruff
        run: ruff check revora tests scripts
      # There is deliberately no `ruff format --check` step. It was here, and it had
      # never passed: 87 of 180 files fail it, because this codebase is hand-wrapped to
      # the 100-column limit that `ruff check` already enforces through E501, and
      # `ruff format` rejoins those lines. A gate that fails on every single push is
      # worse than no gate — it makes CI permanently red, which is how a real failure
      # gets scrolled past. Adopting `ruff format` is a reasonable choice, but it is a
      # one-shot mechanical reformat of the whole tree and it belongs in its own commit,
      # not as a step that quietly blocks every other one.
      - name: Import contracts
        # The structural half of Property 2: policy cannot import the AI layer, and
        # nothing in the decision path can reach synthetic ground truth.
        run: lint-imports
      - name: No float in currency modules
        run: python scripts/check_no_float.py
      - name: Strict typing on money-bearing modules
        # Widened as each phase landed. The list is every module where a wrong type
        # is a wrong amount, a wrong probability or a wrong causal claim.
        run: >-
          mypy -p revora.domain -p revora.policy -p revora.optimizer
          -p revora.providers -p revora.execution -p revora.outcome
          -p revora.memory -p revora.experiment -p revora.metrics
          -p revora.synthetic -p revora.api -p revora.cases -p revora.jobs

  test-fast:
    name: pure + model test tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Pure and model tiers
        run: pytest -m "pure or model" -q

  test-postgres:
    name: postgres test tier
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Postgres tier
        # The service container is the test database directly, so testcontainers is
        # not needed on CI. The pg fixtures read REVORA_TEST_DATABASE_URL when set.
        #
        # "not harness" keeps the synthetic scenarios out of this job. They need the
        # same server but they are minutes rather than seconds, and they have their
        # own two jobs below.
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: pytest -m "pg and not harness" -q

  evidence-null-gate:
    # THE BUILD GATE. A measurement system that reports a lift in a world with no
    # effect is a measurement system whose every other number is untrustworthy, so
    # this failing fails the build. No warning-only mode, and no continue-on-error.
    #
    # It reads twenty independent randomizations of a world with a true lift of zero
    # and allows at most four intervals to exclude zero, because a 95 percent
    # interval excludes zero 5 percent of the time by construction — a single-interval
    # gate would fail one build in twenty for the correct reason and teach everyone to
    # re-run it. See tests/synthetic/test_scenarios.py for the arithmetic.
    name: evidence gate (null scenario)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Null scenario must report no causal effect
        # `--strict-markers` plus pytest's exit code 5 for "no tests ran" is what stops
        # this gate quietly passing by selecting nothing: a renamed test, a dropped
        # `harness` marker or a typo in the filter all fail the step rather than
        # reporting success over an empty selection. Do not add `continue-on-error`
        # here — a warning-only build gate is not a build gate.
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: >-
          pytest tests/synthetic/test_scenarios.py -m harness -q
          -k "null_scenario_reports_no_causal_effect"

  evidence-harness:
    # The full synthetic tier: all four scenarios plus the interval-coverage check
    # across many seeds. Nightly rather than per-push because the coverage check is a
    # minute of Postgres round-trips on its own, and because it answers a question
    # that does not change commit to commit — whether the reported interval is the
    # width it claims to be.
    name: evidence harness (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Synthetic harness tier
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: pytest -m harness -q
