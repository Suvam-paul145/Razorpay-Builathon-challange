# CI mirrors the design's Cost Tiers and the "What CI Enforces Beyond Tests" list.
#
# The gates that are structural claims, not behaviour, run first and cheapest:
# import contracts (the mechanism behind policy AI-isolation), the no-float check,
# strict typing on the money-bearing modules, and lint. Then the pure and model
# test tiers on every push. The Postgres tier runs against a service container
# because the concurrency and constraint claims cannot be tested any other way.
#
# The null-scenario evidence gate is its own job and it runs on every push, not only
# nightly. Task 27.4 asks for the nightly tier plus "a required gate before any demo
# build"; a job that has to pass on the commit a demo is built from is the strongest
# available reading of that, and it costs about a minute. The full harness tier —
# every scenario plus the interval-coverage check — is the nightly job, because the
# coverage check alone is a minute of Postgres round-trips.
#
# The `dashboard` job is the frontend's equivalent of the `static` job: types, the
# honesty lint rules, the component tests and a production build. It is separate from
# the Python jobs rather than folded into one because the two need different toolchains
# and there is no ordering between them — the SPA talks to the API over HTTP and shares
# no code with it, only a set of DTO shapes that `web/src/api/types.ts` restates by hand.
#
# The customer response loop added no job and no marker. That is the point of task 54.1:
# the five existing tiers absorb the feature, so its tests are selected by the filters
# already written below rather than by a sixth one that would have to be kept in step.
# What did change is small and named where it happens — the strict-typing step covers the
# three new packages, the customer-entry router guard gets its own step beside the other
# structural gates, and the nightly harness job now carries the Demo_Batch as well as the
# synthetic scenarios. The `smoke` items this feature adds (the customer page and timeline
# projection latencies, and the customer bundle's transferred size) stay outside every
# gating selection for the reason the `smoke` marker in pyproject.toml gives; the bundle
# one is a vitest case behind `REVORA_WEB_SMOKE`, which is the same decision in the other
# toolchain.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly, after most working days in IST. The harness tier is slow, not urgent.
    - cron: "0 19 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: Rovara

# Every Postgres service below pins postgres:18 to match docker-compose and the managed
# Neon instance. Repeated rather than shared through `env`, because `services.*.image`
# does not expand the `env` context — a variable there would silently resolve to an
# empty image name. Three copies that are checked by a grep in review beats one copy
# that does not work.

jobs:
  static:
    name: static checks (lint, types, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Ruff
        run: ruff check revora tests scripts
      # There is deliberately no `ruff format --check` step. It was here, and it had
      # never passed: 87 of 180 files fail it, because this codebase is hand-wrapped to
      # the 100-column limit that `ruff check` already enforces through E501, and
      # `ruff format` rejoins those lines. A gate that fails on every single push is
      # worse than no gate — it makes CI permanently red, which is how a real failure
      # gets scrolled past. Adopting `ruff format` is a reasonable choice, but it is a
      # one-shot mechanical reformat of the whole tree and it belongs in its own commit,
      # not as a step that quietly blocks every other one.
      - name: Import contracts
        # The structural half of Property 2: policy cannot import the AI layer, and
        # nothing in the decision path can reach synthetic ground truth.
        run: lint-imports
      - name: No float in currency modules
        run: python scripts/check_no_float.py
      - name: Strict typing on money-bearing modules
        # Widened as each phase landed. The list is every module where a wrong type
        # is a wrong amount, a wrong probability or a wrong causal claim.
        #
        # `customer`, `timeline` and `reasoning` joined with the customer response loop,
        # one for each of those three failure modes: the customer page presents an amount
        # to the person being asked to pay it, the timeline presents a server-formatted
        # figure it must not recompute, and the reasoning adapter carries a `confidence`
        # that is compared against two thresholds and has to answer the same way twice.
        # They are also the three directories `scripts/check_no_float.py` gained, and the
        # two checks are stronger together — the lexical one catches a `float` annotation
        # mypy would accept, this one catches the type errors a grep cannot see.
        run: >-
          mypy -p revora.domain -p revora.policy -p revora.optimizer
          -p revora.providers -p revora.execution -p revora.outcome
          -p revora.memory -p revora.experiment -p revora.metrics
          -p revora.synthetic -p revora.api -p revora.cases -p revora.jobs
          -p revora.customer -p revora.timeline -p revora.reasoning
      - name: Customer entry router guard
        # A structural claim rather than a behaviour, which is why it sits here beside the
        # import contracts and not only inside the `pure` tier where it also runs. The
        # duplication is deliberate and costs a couple of seconds: this is the check that
        # the customer response page still ships with no router, and a red X named for it
        # is worth more than the same failure buried in a nine-hundred-test run.
        #
        # The whole module runs, not a `-k` selection: the assertions on either side of the
        # router one — the dashboard's `basename` matching `APP_PREFIX`, and `/pay/*` still
        # 404ing on the API — are the same boundary from the other two directions, and a
        # filter here would be a third list to keep in step with the file.
        run: pytest tests/api/test_spa_mount.py -m pure -q

  test-fast:
    name: pure + model test tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Pure and model tiers
        # `not smoke` excludes the latency and startup-cost assertions. On a shared runner those
        # measure the hardware as much as the code, and a gate that can fail for reasons nobody can
        # act on teaches everyone to re-run the build. They are tagged rather than deleted so the
        # budgets stay written down — see the `smoke` marker in pyproject.toml.
        #
        # The customer response loop lands here without editing this line, which is what "no new
        # marker" buys: the token wire format, the whole `Timeline_Reader`, the cost split, the
        # promise clamp, the `Delay_Reason` table and the resend classification are `pure`; the
        # Customer_Response_Service against in-memory fakes, policy invariance under arbitrary
        # signal content, reasoning authority against a fake adapter and the extended lifecycle
        # state machine are `model`. `--strict-markers` is on by default through pyproject's
        # `addopts`, so a test that reaches for a sixth tier fails collection rather than running
        # in no tier at all.
        run: pytest -m "(pure or model) and not smoke" -q

  dashboard:
    name: dashboard (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rovara/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Rovara/web/package-lock.json
      - name: Install
        # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails
        # if the two have drifted. `install` would silently resolve a newer version and
        # the build would then differ from the one a developer tested.
        run: npm ci --no-audit --no-fund
      - name: Lint
        # The dashboard is plain JavaScript, so lint is the ONLY automated check on the
        # honesty rules: no arithmetic on a money field, no client-side currency
        # formatting or rounding, and no `?? 0` on a figure. Types could never have
        # expressed the first of those anyway — arithmetic operators accept every number
        # subtype, including a branded one — but the absent-value arms used to be checked
        # by the compiler and are not any more. This step carries more weight than it did.
        run: npm run lint
      - name: Tests
        # Includes a test that runs ESLint in-process against the shipped config and
        # asserts the money rule actually fires. A typo in an ESLint selector does not
        # error, it matches nothing — so without this the rule could enforce precisely
        # nothing while the lint step stayed green.
        run: npm run test
      - name: Build
        run: npm run build

  test-postgres:
    name: postgres test tier
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Postgres tier
        # The service container is the test database directly, so testcontainers is
        # not needed on CI. The pg fixtures read REVORA_TEST_DATABASE_URL when set.
        #
        # "not harness" keeps the synthetic scenarios out of this job. They need the
        # same server but they are minutes rather than seconds, and they have their
        # own two jobs below.
        #
        # This selection is where migration `0008` is exercised up and down, where each
        # new constraint is shown rejecting its violation, where RLS is shown denying a
        # cross-tenant read on all four new tables, and where the Review_Sweeper is shown
        # using its index and deduping under two concurrent sweeps. None of those claims
        # can be made against a fake, and all of them are about the database rather than
        # about the feature, which is why they run on every push rather than nightly.
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: pytest -m "pg and not harness and not smoke" -q

  evidence-null-gate:
    # THE BUILD GATE. A measurement system that reports a lift in a world with no
    # effect is a measurement system whose every other number is untrustworthy, so
    # this failing fails the build. No warning-only mode, and no continue-on-error.
    #
    # It reads twenty independent randomizations of a world with a true lift of zero
    # and allows at most four intervals to exclude zero, because a 95 percent
    # interval excludes zero 5 percent of the time by construction — a single-interval
    # gate would fail one build in twenty for the correct reason and teach everyone to
    # re-run it. See tests/synthetic/test_scenarios.py for the arithmetic.
    name: evidence gate (null scenario)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Null scenario must report no causal effect
        # `--strict-markers` plus pytest's exit code 5 for "no tests ran" is what stops
        # this gate quietly passing by selecting nothing: a renamed test, a dropped
        # `harness` marker or a typo in the filter all fail the step rather than
        # reporting success over an empty selection. Do not add `continue-on-error`
        # here — a warning-only build gate is not a build gate.
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: >-
          pytest tests/synthetic/test_scenarios.py -m harness -q
          -k "null_scenario_reports_no_causal_effect"

  evidence-harness:
    # The full synthetic tier: all four scenarios plus the interval-coverage check
    # across many seeds. Nightly rather than per-push because the coverage check is a
    # minute of Postgres round-trips on its own, and because it answers a question
    # that does not change commit to commit — whether the reported interval is the
    # width it claims to be.
    #
    # It also carries the Demo_Batch, and by marker rather than by a second selection.
    # `-m harness` is the tier, and the design puts the Demo_Batch in it: a thousand cases
    # seeded through the signed webhook endpoint, the customer surface driven over HTTP,
    # the required outcome coverage asserted, gap-free audit sequences on every seeded
    # case, and the Demonstration_Experiment reaching COMPLETED with a numeric lift and an
    # interval. A separate job naming those files would be a filter to keep in step with
    # the test tree, and it would answer the same question against the same server twice.
    #
    # "Nightly and pre-demo" is these two triggers and nothing else. `schedule` is the
    # nightly run; `workflow_dispatch` is the pre-demo one — run it against the commit the
    # demo is built from, because that is the only run that says anything about the demo.
    # Verified test-mode recoveries stay out: they need real provider credentials, so they
    # are a documented RUNBOOK.md step rather than a job that would either hold secrets or
    # quietly skip.
    name: evidence + Demo_Batch harness (nightly, pre-demo)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora_ci
          POSTGRES_DB: revora
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U revora -d revora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Harness tier (synthetic scenarios and Demo_Batch)
        env:
          REVORA_TEST_DATABASE_URL: postgresql+psycopg://revora:revora_ci@localhost:5432/revora
        run: pytest -m harness -q
